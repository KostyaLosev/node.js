<section class="auth-card">
  <h2>Register</h2>
  <p class="subtitle">Create an account to access the logic area.</p>

  <form (ngSubmit)="submit()" class="auth-form">
    <label>
      Email
      <input type="email" name="email" [(ngModel)]="email" required />
    </label>

    <label>
      Password
      <input type="password" name="password" [(ngModel)]="password" minlength="8" required />
    </label>

    <label>
      Confirm Password
      <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" minlength="8" required />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating...' : 'Register' }}
    </button>
  </form>

  <p class="switch">
    Already have an account?
    <a routerLink="/login">Login here</a>
  </p>
</section>
